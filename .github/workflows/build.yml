name: Build TUESDAY APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_HOME:        /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_HOME:     /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache Buildozer ────────────────────────────────────────────────
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # ── 4. System dependencies + Java 17 ─────────────────────────────────
      # Install Java 17 HERE first, then confirm it exists before using it
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev \
            libunwind-dev \
            ccache \
            aapt

      # ── 5. Set Java 17 AFTER it is installed ─────────────────────────────
      - name: Set Java 17 as default
        run: |
          # Find actual Java 17 path (handles minor version differences)
          JAVA17=$(find /usr/lib/jvm -name "java" -path "*/java-17*" | head -1)
          JAVAC17=$(find /usr/lib/jvm -name "javac" -path "*/java-17*" | head -1)
          echo "Found java: $JAVA17"
          echo "Found javac: $JAVAC17"
          # Set via update-alternatives now that it's installed
          sudo update-alternatives --install /usr/bin/java java "$JAVA17" 1
          sudo update-alternatives --set java "$JAVA17"
          sudo update-alternatives --install /usr/bin/javac javac "$JAVAC17" 1
          sudo update-alternatives --set javac "$JAVAC17"
          # Write to GITHUB_ENV so all subsequent steps inherit it
          echo "JAVA_HOME=$(dirname $(dirname $JAVA17))" >> $GITHUB_ENV
          java -version
          javac -version

      # ── 6. Install build tools ────────────────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "sh>=1.10,<2.0"
          pip install \
            buildozer==1.5.0 \
            cython==3.0.10 \
            "python-for-android==2024.1.21"
          python -c "import sh; print('sh version OK:', sh.__version__)"

      # ── 7. Install Android SDK cmdline-tools ──────────────────────────────
      - name: Install Android SDK cmdline-tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools \
            $ANDROID_SDK_ROOT/cmdline-tools/latest
          # Symlink for old-style path Buildozer expects
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            $ANDROID_SDK_ROOT/tools/bin/sdkmanager
          echo "sdkmanager version:"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --version

      # ── 8. Accept Android SDK licenses ───────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license

      # ── 9. Write .env ─────────────────────────────────────────────────────
      - name: Write .env
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN_AI }}" > .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
      # ── Wipe stale p4a Python build cache ────────────────────────────────
      - name: Clear stale p4a cache
        run: |
          rm -rf /home/runner/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3
          echo "Cleared stale python3 build cache"
      # ── 10. Build APK ─────────────────────────────────────────────────────
      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug 2>&1 | tee build.log

      # ── 11. Show build log tail ───────────────────────────────────────────
      - name: Show build log tail
        if: always()
        run: |
          echo "===== LAST 100 LINES OF BUILD LOG ====="
          tail -n 100 build.log || echo "(build.log not found)"

      # ── 12. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuesday-mobile-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 13. Upload build log ──────────────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
